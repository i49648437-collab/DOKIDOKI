<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Литературный клуб</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: Georgia, 'Times New Roman', serif;
        user-select: none;
    }

    body {
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .game-container {
        width: 95vw;
        height: 95vh;
        background: #fbe9e7;
        display: flex;
        flex-direction: column;
        position: relative;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
    }

    .scene-area {
        flex: 1;
        position: relative;
        background: #1e1316;
        cursor: pointer;
        overflow: hidden;
        min-height: 0;
    }

    .bg-layer {
        position: absolute;
        inset: 0;
        background-size: contain;
        background-position: center;
        background-repeat: no-repeat;
        background-color: #1e1316;
        opacity: 0;
        transition: opacity 0.55s ease;
    }

    .bg-layer.active {
        opacity: 1;
    }

    .character-sprite {
        position: absolute;
        bottom: -8%;
        left: 50%;
        transform: translateX(-50%) scale(1);
        height: 92%;
        width: auto;
        max-width: 85%;
        object-fit: contain;
        filter: drop-shadow(0 10px 16px rgba(0, 0, 0, 0.65));
        opacity: 0;
        transition: opacity 0.4s ease;
        z-index: 2;
        pointer-events: none;
    }

    .character-sprite.show {
        opacity: 1;
    }

    .dialogue-box {
        background: rgba(250, 243, 224, 0.92);
        margin: 0 10px 10px;
        border-radius: 18px;
        padding: 14px 18px;
        min-height: 135px;
        max-height: 24vh;
        cursor: pointer;
        z-index: 5;
        box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .speaker-name {
        font-weight: bold;
        font-size: 1.25rem;
        margin-bottom: 5px;
        text-shadow: 1px 1px 0 rgba(255,255,255,0.65);
    }

    .dialogue-text {
        font-size: 1.08rem;
        line-height: 1.5;
        word-break: break-word;
    }

    .dialogue-text span {
        opacity: 0;
        animation: fadeInChar 0.02s forwards;
    }

    @keyframes fadeInChar {
        to {
            opacity: 1;
        }
    }

    .choices-container {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
    }

    .choice-btn {
        background: rgba(241, 224, 208, 0.95);
        border: 2px solid #795548;
        color: #3e2723;
        padding: 10px 18px;
        border-radius: 30px;
        font-weight: bold;
        font-size: 0.98rem;
        cursor: pointer;
        transition: 0.2s;
        flex: 1 1 auto;
        text-align: center;
    }

    .choice-btn:hover {
        background: #d7ccc8;
        border-color: #4e342e;
    }

    .next-indicator {
        text-align: right;
        font-style: italic;
        color: #6d4c41;
        margin-top: 7px;
        animation: pulse 1.4s infinite;
        font-size: 0.92rem;
    }

    @keyframes pulse {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 1; }
    }

    .hidden {
        display: none !important;
    }

    .title-screen {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.62);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        z-index: 10;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.45s ease;
        overflow-y: auto;
        padding: 20px;
    }

    .title-screen.show {
        opacity: 1;
        pointer-events: auto;
    }

    .title-screen h1 {
        color: #fff;
        text-shadow: 2px 2px 5px #000;
        font-size: 2.8rem;
        letter-spacing: 2px;
        text-align: center;
    }

    .menu-buttons {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
    }

    .gender-select {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: center;
    }

    .gender-btn {
        min-width: 140px;
        padding: 10px 16px;
        border-radius: 25px;
        border: 2px solid rgba(255, 255, 255, 0.38);
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
    }

    .gender-btn:hover {
        background: rgba(255, 255, 255, 0.22);
    }

    .gender-btn.active {
        background: #b34141;
        border-color: #fff;
        box-shadow: 0 0 16px rgba(179, 65, 65, 0.5);
    }

    .menu-btn-big {
        padding: 15px 42px;
        font-size: 1.35rem;
        background: #b34141;
        color: #fff;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        font-weight: bold;
        transition: 0.2s;
        min-width: 220px;
    }

    .menu-btn-big:hover {
        background: #8b2a2a;
        transform: scale(1.03);
    }

    .reset-files-btn {
        padding: 10px 22px;
        background: rgba(45, 45, 45, 0.88);
        color: #fff;
        border: 1px solid #999;
        border-radius: 22px;
        cursor: pointer;
        font-size: 0.95rem;
    }

    .reset-files-btn:hover {
        background: rgba(80, 80, 80, 0.95);
    }

    .save-load-panel {
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 11;
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
    }

    .save-load-btn {
        background: rgba(0, 0, 0, 0.62);
        color: #fff;
        border: 1px solid #aaa;
        padding: 8px 13px;
        border-radius: 18px;
        cursor: pointer;
        font-size: 0.86rem;
        backdrop-filter: blur(4px);
        transition: 0.2s;
    }

    .save-load-btn:hover {
        background: rgba(0, 0, 0, 0.85);
        border-color: #fff;
    }

    .day-transition {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.86);
        color: #fff;
        font-size: 3.4rem;
        font-weight: bold;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.75s ease;
        z-index: 20;
        text-shadow: 2px 2px 8px #000;
    }

    .day-transition.show {
        opacity: 1;
    }

    #videoContainer {
        position: absolute;
        inset: 0;
        background: #000;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    #introVideo {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    #videoPrompt {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.72);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #fff;
        gap: 18px;
        z-index: 52;
        text-align: center;
        padding: 20px;
        font-size: 2rem;
        text-shadow: 2px 2px 5px #000;
    }

    #startVideoBtn {
        padding: 15px 40px;
        font-size: 1.35rem;
        background: #b34141;
        border: none;
        color: #fff;
        border-radius: 28px;
        cursor: pointer;
        font-weight: bold;
        transition: 0.2s;
    }

    #startVideoBtn:hover {
        background: #8b2a2a;
        transform: scale(1.03);
    }

    .skip-hint {
        position: absolute;
        bottom: 18px;
        right: 18px;
        color: rgba(255, 255, 255, 0.85);
        background: rgba(0, 0, 0, 0.5);
        padding: 7px 14px;
        border-radius: 18px;
        z-index: 51;
        display: none;
        font-size: 0.95rem;
    }

    .toast {
        position: fixed;
        bottom: 28px;
        left: 50%;
        transform: translateX(-50%) translateY(20px);
        background: #2a1f1f;
        color: #fbe9e7;
        padding: 11px 24px;
        border-radius: 25px;
        border: 1px solid #6d4c41;
        opacity: 0;
        transition: 0.3s ease;
        z-index: 200;
        pointer-events: none;
        text-align: center;
        max-width: 90vw;
    }

    .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 700px) {
        .title-screen h1 {
            font-size: 2rem;
        }

        .dialogue-box {
            min-height: 115px;
        }

        .dialogue-text {
            font-size: 0.98rem;
        }

        .menu-btn-big {
            min-width: 180px;
            font-size: 1.1rem;
        }

        .gender-btn {
            min-width: 115px;
            font-size: 0.9rem;
        }
    }
</style>
</head>
<body>

<div class="game-container" id="gameContainer">
    <div class="scene-area" id="sceneArea">
        <div class="bg-layer active" id="bgLayerA"></div>
        <div class="bg-layer" id="bgLayerB"></div>

        <img id="characterImg" class="character-sprite" alt="">

        <div class="save-load-panel" id="saveLoadPanel">

            <button class="save-load-btn" id="saveButton" type="button">💾 Сохранить</button>
            <button class="save-load-btn" id="loadButton" type="button">📂 Загрузить</button>
            <button class="save-load-btn" id="menuButton" type="button">🏠 Меню</button>
        </div>

        <div class="title-screen" id="titleScreen">
            <h1 id="titleHeading">Литературный клуб</h1>

            <div class="menu-buttons">
                <div class="gender-select" id="genderSelect" title="Пол игрока">
                    <button id="genderMaleBtn" class="gender-btn" type="button">👦 Парень</button>
                    <button id="genderFemaleBtn" class="gender-btn" type="button">👧 Девушка</button>
                    <button id="genderNeutralBtn" class="gender-btn" type="button">⚪ Не указывать</button>
                </div>

                <div class="gender-select" id="charGenderSelect" title="Пол персонажей">
                    <button id="charGenderFemaleBtn" class="gender-btn" type="button">👩 Девушки</button>
                    <button id="charGenderMaleBtn" class="gender-btn" type="button">👨 Мужчины</button>
                </div>

                <button id="startButton" class="menu-btn-big" type="button">Начать игру</button>
                <button id="resetFilesBtn" class="reset-files-btn" type="button">🧹 Удалить все настройки проводника</button>
            </div>
        </div>

        <div id="dayTransition" class="day-transition"></div>
    </div>

    <div class="dialogue-box" id="dialogueBox">
        <div class="speaker-name" id="speakerName"></div>
        <div class="dialogue-text" id="dialogueText">Нажмите, чтобы начать...</div>
        <div id="choicesArea" class="choices-container"></div>
        <div id="nextMarker" class="next-indicator hidden">▼ Продолжить ▼</div>
    </div>

    <div id="videoContainer">
        <video id="introVideo" muted playsinline preload="auto">
            <source src="видео/заставка видео.mp4" type="video/mp4">
        </video>

        <div id="videoPrompt">
            <div id="videoPromptText">Добро пожаловать в Литературный клуб</div>
            <button id="startVideoBtn" type="button">Смотреть вступление</button>
        </div>

        <div class="skip-hint" id="skipHint">Нажмите, чтобы пропустить</div>
    </div>
</div>

<div class="toast" id="toast"></div>

    function escapeRegExp(str) {
        return String(str).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function matchCase(src, dst) {
        if (!src || !dst) return dst;
        const first = src.charAt(0);
        if (first === first.toUpperCase() && first !== first.toLowerCase()) {
            return dst.charAt(0).toUpperCase() + dst.slice(1);
        }
        return dst;
    }

    function replaceWord(text, from, to) {
        const re = new RegExp('(^|[^а-яА-ЯёЁ])(' + escapeRegExp(from) + ')(?![а-яА-ЯёЁ])', 'gi');
        return text.replace(re, function (m, p1, p2) {
            return p1 + matchCase(p2, to);
        });
    }

    function applyGender(text, speaker) {
        if (!text) return '';

        const pg = getPlayerGender();
        let out = String(text);

        const defaultName = pg === 'f' ? td('любимая', 'my love') : (pg === 'm' ? td('любимый', 'my love') : td('дорогой игрок', 'dear player'));
        out = out.replace(/\[player\]/g, defaultName);

        const playerSpeaker = ['hero', 'heroRoom', 'street', 'hallway'].indexOf(speaker) !== -1;

        if (pg === 'f') {
            out = autoGenderFemale(out);
        }

        if (getCharGender() === 'm') {
            if (playerSpeaker) {
                out = autoCharMale(out, true);
            } else {
                out = autoCharMale(out, false);
            }
        }

        return out;
    }

    function setBg(path) {
        const next = bgActive === bgLayerA ? bgLayerB : bgLayerA;
        next.style.backgroundImage = path ? 'url("' + path + '")' : 'none';
        next.classList.add('active');
        bgActive.classList.remove('active');
        bgActive = next;
    }

    function setSprite(path, charKey) {
        if (!path) {
            charImg.classList.remove('show');
            charImg.removeAttribute('src');
            return;
        }

        const c = charKey ? characters[charKey] : null;
        const scale = c && c.scale ? c.scale : 1;

        charImg.style.transform = 'translateX(-50%) scale(' + scale + ')';

        if (charImg.getAttribute('data-src') !== path) {
            charImg.classList.remove('show');
            charImg.setAttribute('data-src', path);

            charImg.onload = function () {
                requestAnimationFrame(function () {
                    charImg.classList.add('show');
                });
            };

            charImg.onerror = function () {
                charImg.classList.remove('show');
            };

            charImg.src = path;
        } else {
            requestAnimationFrame(function () {
                charImg.classList.add('show');
            });
        }
    }

    function updateScene(charKey, bgOverride) {
        const c = characters[charKey] || characters.narrator;

        speakerName.textContent = getCharName(charKey);
        speakerName.style.color = c.color || '#3e2723';

        if (typeof bgOverride !== 'undefined' && bgOverride !== null) {
            setBg(bgOverride);
        } else if (c.bg !== null && typeof c.bg !== 'undefined') {
            setBg(c.bg);
        }

        setSprite(c.sprite || '', charKey);
    }

    function glitchText(text) {
        return String(text).split('').map(function (ch) {
            if (Math.random() < 0.16) return '█';
            if (Math.random() < 0.12) return String.fromCharCode(33 + Math.floor(Math.random() * 90));
            return ch;
        }).join('');
    }

    function typeText(rawText, glitch, speaker) {
        dialogueText.innerHTML = '';

        let text = applyGender(rawText || '', speaker || 'narrator');
        if (glitch) text = glitchText(text);

        const frag = document.createDocumentFragment();

        Array.from(text).forEach(function (ch, i) {
            const span = document.createElement('span');
            span.textContent = ch;
            span.style.animationDelay = (i * 12) + 'ms';
            frag.appendChild(span);
        });

        dialogueText.appendChild(frag);
    }

    function clearChoices() {
        choicesArea.innerHTML = '';
    }

    function showNext(visible) {
        nextMarker.classList.toggle('hidden', !visible);
    }

    function addChoice(label, onClick) {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.textContent = label;

        btn.onclick = function (e) {
            e.stopPropagation();
            clearChoices();
            showNext(false);
            onClick();
        };

        choicesArea.appendChild(btn);
    }

    function showDayTransition(n) {
        dayTransition.textContent = t('day') + ' ' + n;
        dayTransition.classList.add('show');
        setTimeout(function () {
            dayTransition.classList.remove('show');
        }, 1500);
    }

    function applyChoiceFx(fx) {
        if (!fx || !state) return;

        if (typeof fx.aff === 'number') {
            state.affection = Math.max(0, Math.min(4, (state.affection || 0) + fx.aff));
        }

        if (typeof fx.cor === 'number') {
            state.corruption = (state.corruption || 0) + fx.cor;
        }

        if (fx.route) state.route = fx.route;
        if ('bow' in fx) state.bowFixed = !!fx.bow;
        if ('bump' in fx) state.helpedWithBump = !!fx.bump;
        if (fx.helper) state.helper = fx.helper;
        if ('love' in fx) state.loveConfessed = !!fx.love;
        if ('night' in fx) state.visitedAtNight = !!fx.night;
    }

    function renderCurrentStep() {
        if (stepIndex >= activeSteps.length) {
            finishDay();
            return;
        }

        const step = activeSteps[stepIndex] || {};

        if (!step.type || step.type === 'line') {
            updateScene(step.speaker || 'narrator', step.bg || null);
            typeText(step.text || '', !!step.glitch, step.speaker || 'narrator');
            clearChoices();
            showNext(true);
            return;
        }

        if (step.type === 'choice') {
            updateScene(step.speaker || 'narrator', step.bg || null);
            typeText(step.text || td('Выбери действие.', 'Choose an action.'), false, step.speaker || 'narrator');
            showNext(false);
            clearChoices();

            (step.options || []).forEach(function (opt) {
                const label = currentLang === 'en' ? (opt.enLabel || opt.label) : opt.label;

                addChoice(label, function () {
                    applyChoiceFx(opt.fx);

                    const resolvedLines = (opt.lines || []).map(function (l) {
                        return Object.assign({ type: 'line' }, l);
                    });

                    activeSteps.splice(stepIndex, 1, ...resolvedLines);
                    renderCurrentStep();
                });
            });

            return;
        }

        if (step.type === 'end') {
            updateScene(step.speaker || 'narrator', step.bg || null);
            typeText(step.text || '', !!step.glitch, step.speaker || 'narrator');
            clearChoices();
            showNext(false);

            state.started = false;

            setTimeout(function () {
                titleScreen.classList.add('show');
                setBg(IMG.title);
                setSprite(null);
                updateAllUI();
            }, 4000);

            return;
        }

        stepIndex++;
        renderCurrentStep();
    }

    function advance() {
        if (!state || !state.started) return;
        if (titleScreen.classList.contains('show')) return;
        if (videoContainer.style.display !== 'none') return;
        if (choicesArea.children.length > 0) return;

        const step = activeSteps[stepIndex];
        if (!step) return;
        if (step.type === 'choice' || step.type === 'end') return;

        stepIndex++;
        renderCurrentStep();
    }

    function startDay(idx) {
        dayIndex = idx;
        const day = currentScript[idx];

        if (!day) {
            finishDay();
            return;
        }

        showDayTransition(day.title || (idx + 1));

        activeSteps = day.steps ? day.steps() : (day.steps || []);
        stepIndex = 0;

        if (day.onEnter) day.onEnter();

        renderCurrentStep();
    }

    function finishDay() {
        const day = currentScript[dayIndex];

        if (day && day.onComplete) {
            day.onComplete(state);
            return;
        }

        if (dayIndex + 1 < currentScript.length) {
            startDay(dayIndex + 1);
        } else {
            state.started = false;
            titleScreen.classList.add('show');
            setBg(IMG.title);
            setSprite(null);
            typeText(t('clickToStart'), false, 'narrator');
            showNext(false);
            updateAllUI();
        }
    }

    function startNewGame() {
        state = freshState();
        currentScript = scriptAct1;
        state.started = true;
        state.paused = false;

        titleScreen.classList.remove('show');
        videoContainer.style.display = 'none';

        startDay(0);
    }

    function saveGame() {
        if (!state || !state.started) {
            showToast(t('cannotSaveNow'));
            return;
        }

        try {
            const payload = {
                state: state,
                activeSteps: activeSteps,
                stepIndex: stepIndex,
                dayIndex: dayIndex,
                timestamp: Date.now()
            };

            localStorage.setItem(SAVE_KEY, JSON.stringify(payload));
            showToast(t('saved'));
        } catch (e) {
            showToast(t('saveFailed'));
        }
    }

    function loadGame() {
        try {
            const raw = localStorage.getItem(SAVE_KEY);
            if (!raw) {
                showToast(t('noSaves'));
                return;
            }

            const payload = JSON.parse(raw);

            state = payload.state || freshState();
            activeSteps = payload.activeSteps || [];
            stepIndex = payload.stepIndex || 0;
            dayIndex = payload.dayIndex || 0;
            currentScript = scriptAct1;

            state.started = true;
            state.paused = false;

            titleScreen.classList.remove('show');
            videoContainer.style.display = 'none';

            renderCurrentStep();
            showToast(t('loaded'));
        } catch (e) {
            showToast(t('loadFailed'));
        }
    }

    function goToMenu() {
        if (state && state.started) {
            if (!confirm(t('backToMenu'))) return;
        }

        if (state) {
            state.started = false;
            state.paused = true;
        }

        titleScreen.classList.add('show');
        setBg(IMG.title);
        setSprite(null);
        clearChoices();
        showNext(false);
        typeText(t('clickToStart'), false, 'narrator');
        updateAllUI();
    }

    function setPlayerGender(g) {
        savePlayerGender(g);
        updateAllUI();

        if (g === 'f') showToast(t('genderFemaleToast'));
        else if (g === 'm') showToast(t('genderMaleToast'));
        else showToast(t('genderNeutralToast'));
    }

    function setCharGenderUI(g) {
        saveCharGender(g);
        applyCharGenderImages();
        updateAllUI();

        if (state && state.started) {
            renderCurrentStep();
        } else {
            setBg(IMG.title);
            setSprite(null);
        }

        if (g === 'f') {
            showToast(t('charGenderFemaleToast'));
        } else {
            showToast(t('charGenderMaleToast'));
            alert('Здравствуйте все картинки сгенерированы с помощью ИИ и так как не все изображения пропускаются правилам ИИ некоторые изображения остаются такими-же извините за неудобства с любовью MainVan-n');
        }
    }

    let videoStarted = false;

    function showTitleFromVideo() {
        videoStarted = true;
        videoContainer.style.display = 'none';
        titleScreen.classList.add('show');
        setBg(IMG.title);
        updateAllUI();
    }

    function tryPlayVideo() {
        videoStarted = true;
        videoPrompt.style.display = 'none';
        skipHint.style.display = 'block';

        try {
            const p = introVideo.play();
            if (p && typeof p.catch === 'function') {
                p.catch(function () {
                    showTitleFromVideo();
                });
            }
        } catch (e) {
            showTitleFromVideo();
        }
    }

    startVideoBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        tryPlayVideo();
    });

    introVideo.addEventListener('click', function () {
        if (videoStarted) showTitleFromVideo();
    });

    introVideo.addEventListener('ended', function () {
        if (videoStarted) showTitleFromVideo();
    });

    introVideo.addEventListener('error', function () {
        if (videoStarted) showTitleFromVideo();
    });

    skipHint.addEventListener('click', function (e) {
        e.stopPropagation();
        showTitleFromVideo();
    });

    sceneArea.addEventListener('click', function () {
        advance();
    });

    $('dialogueBox').addEventListener('click', function () {
        advance();
    });

    nextMarker.addEventListener('click', function (e) {
        e.stopPropagation();
        advance();
    });

    titleScreen.addEventListener('click', function (e) {
        e.stopPropagation();
    });

    saveLoadPanel.addEventListener('click', function (e) {
        e.stopPropagation();
    });

    startButton.addEventListener('click', function (e) {
        e.stopPropagation();

        if (state && state.started) {
            titleScreen.classList.remove('show');
            videoContainer.style.display = 'none';
            renderCurrentStep();
        } else {
            startNewGame();
        }
    });

    resetFilesBtn.addEventListener('click', function (e) {
        e.stopPropagation();

        if (!confirm(t('resetExplorerConfirm'))) return;

        try {
            localStorage.removeItem(PLAYER_GENDER_KEY);
            localStorage.removeItem(CHAR_GENDER_KEY);
            localStorage.removeItem(SAVE_KEY);
        } catch (err) {}

        showToast(t('resetExplorerDone'));

        setTimeout(function () {
            location.reload();
        }, 500);
    });

    saveButton.addEventListener('click', function (e) {
        e.stopPropagation();
        saveGame();
    });

    loadButton.addEventListener('click', function (e) {
        e.stopPropagation();
        loadGame();
    });

    menuButton.addEventListener('click', function (e) {
        e.stopPropagation();
        goToMenu();
    });

    langButton.addEventListener('click', function (e) {
        e.stopPropagation();
        currentLang = currentLang === 'ru' ? 'en' : 'ru';
        updateAllUI();

        if (state && state.started) {
            renderCurrentStep();
        } else {
            typeText(t('clickToStart'), false, 'narrator');
        }
    });

    genderMaleBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        setPlayerGender('m');
    });

    genderFemaleBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        setPlayerGender('f');
    });

    genderNeutralBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        setPlayerGender('n');
    });

    charGenderFemaleBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        setCharGenderUI('f');
    });

    charGenderMaleBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        setCharGenderUI('m');
    });

    applyCharGenderImages();
    state = freshState();
    currentScript = scriptAct1;

    updateAllUI();
    setBg(IMG.title);
    typeText(t('clickToStart'), false, 'narrator');
    showNext(false);

})();
</script>
