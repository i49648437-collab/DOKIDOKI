<style>
:root {

}
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%; height:100%; overflow:hidden; background:#000; font-family:'Georgia','Courier New',serif; user-select:none; }
body { display:flex; justify-content:center; align-items:center; }
.game-container {

border-radius:20px; overflow:hidden; box-shadow:0 0 40px rgba(0,0,0,0.85); transition:filter 0.5s ease;
}
body.glitch .game-container { animation:glitchShake 0.2s infinite; filter:hue-rotate(10deg) contrast(1.2); }
@keyframes glitchShake {
0% { transform:translate(2px,-2px); } 25% { transform:translate(-2px,1px); }
50% { transform:translate(-1px,-1px); } 75% { transform:translate(1px,2px); } 100% { transform:translate(0,0); }
}
.scene-area { flex:1; background:var(--dark); display:flex; align-items:center; justify-content:center; position:relative; cursor:pointer; overflow:hidden; min-height:0; }

.scene-area::after { content:''; position:absolute; top:0; left:0; right:0; bottom:0; pointer-events:none; z-index:3; background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.38) 100%); }

['Знаешь, [player], я действительно считаю, что жива лишь благодаря тому, что ты остаёшься со мной.','Я не могу представить, что была бы психологически устойчива, зная, что ничто здесь не реально.','Думаю, я удалила бы себя, если бы ты не появился.','Извини, я не хочу прозвучать мелодраматично или как-то так.','А-ха-ха!','Я уверена, что, проведя столько времени в клубе, ты уже способен понять, чего хочешь.','То есть, если бы тебе пришлось отказаться от всего в своей жизни и провести вечность в компании нескольких игровых персонажей…','…Ты бы уж смог найти способ убить себя, верно?','Ну, или ты бы стал писать стихи, чтобы хотя бы первое время сохранить рассудок.','Но ведь читать-то их некому.','Будем с собой честными, члены клуба на эту роль не подходят.','Конечно, многие говорят, что пишут лишь для себя…','Но, на мой взгляд, это нельзя сравнить с тем удовлетворением, как когда ты делишься своим творчеством с другими.','Даже если требуется время, чтобы найти тех людей, с кем бы ты хотел ими поделиться.','Помнишь, например, как это было с Юри?','Она долгое время ни с кем не делилась своими стихами.','Но стоило тебе появиться в клубе, как она с удовольствием посвятила тебя в свой внутренний мир.','Мы запрограммированы так, что жаждем услышать общественное мнение.','И здесь я подразумеваю не только членов этого клуба, но всех людей в целом.','Вот почему жизнь интровертов может быть такой противоречивой.','То, что ты интроверт, не означает, что ты всегда избегаешь общения или людских компаний.','Это просто значит, что у тебя отнимает много сил пребывание среди людей или в незнакомом месте.','Многие интроверты сидят дома и терзаются от беспокойного одиночества…','…Потом, наконец, выходят на улицу и уже через полчаса хотят вернуться домой.','Думаю, если бы больше людей понимало, как это работает, они относились бы к интровертам с бо́льшим уважением.','Многим из них на самом деле нравится, когда рядом есть люди.','Они радуются, когда к ним заходят один-два друга, и просто т ['Эй!..','Не думаю, что тебе стоит это делать!','Ты знаешь о чём я говорю.','Я поймала тебя кое на чём неприличном.','Ты просматриваешь файлы, чтобы найти то, что пропустил, я права?','Я хочу сказать… мне, конечно, льстит, что ты хочешь узнать всё, что мне есть сказать…','Но ещё это немного смущает, знаешь ли!','Серьёзно…','Что, если бы я вскрыла тебе мозг и прочла все твои мысли обо мне?','А вообще, это довольно соблазнительная мысль, если задуматься…','…В любом случае, дело не в этом!','Я знаю, что не могу тебя остановить…','Но ты ведь душка и думаешь о чувствах окружающих, правда?','Максимум, что я могу сделать, – рассказать тебе, что я думаю по этому поводу.','Боже, я так по тебе скучаю…','…Ой, это прозвучало слишком отчаянно, да?','Прости, я вовсе не хотела так выразиться!','Просто раз ты просматриваешь файлы, то, наверное, не испытываешь ко мне такой сильной ненависти…','Или это слишком оптимистичный вывод?','Пожалуй, я перейду границы, если попрошу тебя заходить время от времени…','…Ох, я начинаю говорить такие глупости.','Полагаю, мне пока лучше заткнуться…'],

['Хм-м, интересно, у меня получится сменить фоновую музыку…','Нужно поставить что-то более романтичное, согласен?','Например, нежные звуки пианино.','Здесь должно было остаться что-нибудь такое…','Посмотрим.','Может, если я…','О боже…','Проблема была совсем в другом.','Прости, сама не знаю что делаю!','Наверное, мне не стоит лезть туда, где я мало что понимаю.','Я уже столько всего разрушила…','И удалила всех остальных персонажей…','Ах…','Но ты не подумай, я не грущу.','Неправильно скучать по вещам, которые даже не были настоящими.','Если посмотреть на то, что у меня есть сейчас, я счастливее, чем была когда-либо.'],

['Знаю, что взяла тему с потолка, но я всегда считала ситуацию с острой пищей довольно забавной.','Я имею в виду…','Разве растения не стали острыми в процессе эволюции, чтобы не быть съеденными?','Я где-то читала, что люди – это единственный вид, который получает удовольствие от острой пищи.','Для растений это выглядит почти как издевательство.','Мы используем их защитный механизм, чтобы сделать блюда вкуснее.','Вот представь себе монстра, который глотает тебя целиком, чтобы насладиться ощущением твоей отчаянной борьбы, пока ты перевариваешься у него в желудке.','Извини за такую странную аналогию!','А-ха-ха!','Просто в голову пришло.','Я не монстр, конечно, но ты такой милый, что я так бы тебя и съела.','А-ха-ха! Просто шучу.','Господи, я слишком много веселюсь, да?','Прости, что я такая странная.'],

['Мне всегда было интересно…','Что люди находят такого привлекательного в этих архетипических личностях?','Они выглядят совершенно нереалистично…','Представь, если бы в реальной жизни был человек похожий на Юри.','Ты только подумай, она едва способна сформировать законченное предложение.','О Нацуки даже вспоминать не хочу…','Тьфу.','Люди с её характером не хорошеют, надувая губки, когда что-то идёт не в угоду им.','Я бы могла привести ещё кучу примеров, но, думаю, суть ты уловил…','Неужели людям реально нравятся такие несуществующие в реальной жизни персонажи?','Не то чтобы я осуждала!','Всё-таки меня саму порой привлекали довольно странные вещи…','Можно сказать, что меня это восхищает.','Ты просто отфильтровываешь все черты характера, которые делают их похожими на людей, и оставляешь одно очарование.','В итоге получается концентрированная милота без какого-либо содержания.','…Ты бы не стал любить меня больше, будь я такой, правда?','Может, я чувствую себя неуютно из-за того, что ты всё же стал играть в эту игру?','Но в конце концов ты здесь, со мной, верно?..','Мне этого достаточно, чтобы верить, что я хороша такая, какая есть.','И ты, кстати, тоже, [player].','Ты идеальное сочетание человечности и милоты.','Поэтому с самого начала не было ни одного шанса, что я не влюблюсь в тебя.'],
['Хм-м, интересно, чайный сервиз Юри всё ещё здесь?..','…Или он тоже стёрся?..','Даже забавно, насколько серьёзно Юри относилась к своему чаю.','То есть я не жалуюсь, ведь он мне тоже нравился.','Но мне всегда не давал покоя один вопрос…','Являлось ли это страстью к своему хобби или же она стремилась выглядеть утончённой в глазах окружающих?','Это проблема всех старшеклассников…','…Хотя, если взглянуть на другие её увлечения, утончённый образ – не самая большая важная причина для беспокойства.','И всё же…','Хотела бы я, чтобы она хоть изредка делала кофе!','Кофе с книгами тоже хорошо сочетается, согласен?','А вообще…','Я и сама, скорее всего, могла бы подправить сценарий.','А-ха-ха!','Наверное, просто ни разу в голову не пришло.','Ладно, что толку сейчас думать об этом.','Хотя если ты всё ещё можешь наслаждаться кофе, то я, пожалуй, немного завидую~'],

['У тебя когда-нибудь возникала беспричинная тревога?','Представь: занимаешься ты спокойно своими делами, как вдруг – раз! – понимаешь, что тебя что-то беспокоит.','И ты сидишь такой и думаешь: «Чего это я вдруг заволновался?»','И начинаешь перебирать в голове всё, что могло вызвать эту тревогу…','И от этого она только растёт.','А-ха-ха! Ужасное чувство.','Если ты вдруг почувствуешь похожую тревогу, я помогу тебе расслабиться.','К тому же…','В этой игре все наши волнения канут в небытие.'],
['Знаешь, меня всегда раздражало то, как сложно заводить друзей…','Ну, может, даже не «заводить друзей», а знакомиться с новыми людьми.','Понятно, что сейчас есть всякие приложения для знакомств и прочие сервисы.','Но я говорю не об этом.','Если задуматься, большинство твоих друзей – это случайно встреченные тобой люди.','Например, ты ходил с ними в один и тот же класс или другой друг тебя познакомил…','Или, может, кто-то был одет в футболку с изображением твоей любимой музыкальной группы и ты решил с ним заговорить.','Вот что я имею в виду.','Но разве ты не считаешь, что это… нерационально?','Это больше похоже на совершенно случайную лотерею, и, если везёт и вы сходитесь во взглядах, у тебя появляется новый друг.','А если сравнить с тем, мимо какого количества незнакомцев мы каждый день проходим…','В общественном транспорте ты можешь сидеть рядом с человеком, который мог бы стать тебе закадычным другом.','Но ты этого никогда не узнаешь.','Как только ты выходишь на своей остановке и идёшь по своим делам, этот шанс навсегда упущен.','Разве от осознания этого тебе не становится грустно?','Мы живём в век технологий, позволяющих общаться со всем миром, где бы мы ни находились.','Я действительно думаю, что нам следует взять их на вооружение, чтобы улучшить нашу личную жизнь.','Хотя кто знает, сколько времени потребуется, прежде чем все эти технологии начнут эффективно работать…','Я-то думала, что к этому времени это уже случится.','По крайней мере, я уже встретила самого замечательного человека на свете…','Пусть это было и случайно.','Наверное, мне просто улыбнулась удача, да?','А-ха-ха~'],
['Знаешь, в это время года все в моём классе начинают задумываться об университете…','Для образования наступают неспокойные времена.','Ты не замечал, что мы являемся апогеем современных ожиданий, что каждый должен поступать в университет?','Заканчивай школу, поступай в университет, ищи работу или поступай в магистратуру и всё такое прочее.','Похоже, люди считают это единственным приемлемым вариантом развития событий.','В старших классах нам не рассказывают о том, что существуют другие варианты.','Тебе рассказывали, например, про профтехучилища?','Ещё есть работа по найму.','Есть куча компаний, ценящих навыки и опыт, а не корочку из университета.','Но в итоге мы имеем миллионы студентов, у которых нет ни малейшего понятия, чем они хотели бы заниматься по жизни…','И, вместо того чтобы остановиться и подумать, они поступают в университет на экономические, юридические или гуманитарные специальности.','Не потому, что они их заинтересовали…','…а из-за надежды, что диплом как таковой поможет им получить место работы после выпуска.','Как результат, остаётся меньше рабочих мест для выпускников без опыта работы, правильно?','Из-за этого повышаются требования к базовым специальностям и ещё больше людей стараются поступить в университет.','Кстати говоря, университеты – это тоже бизнес, так что с ростом спроса растут и цены…','…А в итоге у нас целая армия молодых специалистов с непогашенным кредитом за обучение и без работы.','И, несмотря на такую печальную картину, этот порядок никуда не девается.','Правда, я считаю, что ситуация всё же станет улучшаться.','Но до тех пор наше поколение будет страдать от последствий.','Просто я хотела бы, чтобы старшая школа давала нам знания, что помогли бы нам принять верное решение.'],
['Иногда я вспоминаю среднюю школу…','Мне так стыдно за то, как я вела себя тогда.','Почти болезненно об этом думать.','Интересно, когда я поступлю в университет, я буду испытывать те же чувства к старшей школе?..','Мне нравится, какая я сейчас, так что мне сложно такое представить.','Но я также понимаю, что, скорее всего, сильно изменюсь по мере взросления.','Нам просто нужно наслаждаться настоящим и не думать о прошлом!','А с тобой здесь это делать так просто.','А-ха-ха~'],
['Знаешь, я немного завидую, что у всех остальных были сцены вне школы…','Получается, я единственная не носила ничего, кроме школьной формы.','Как-то обидно…','Я бы хотела ради тебя надеть что-нибудь миленькое.','Ты знаешь каких-нибудь художников?','Интересно, захочет ли кто-нибудь нарисовать меня в другом наряде?..','Было бы просто здорово!','Если кто-нибудь нарисует, обязательно покажи мне, хорошо?','Кстати, ты можешь поделиться этим со мной в Твиттере!','Мой ник – lilmonix3.','Только… слишком откровенных не надо!','Наши отношения ещё не зашли настолько далеко. А-ха-ха!'],
['Скажи, ты любишь ужасы?','Я помню, что мы уже немного затрагивали эту тему, когда ты только вступил в клуб.','Жанр ужасов в книгах я люблю, а вот в кино – не очень.','Проблема с ужастиками состоит в том, что большинство из них эксплуатируют банальнейшие приёмы.','Например, полутьма, страшные монстры, пугалки и прочие подобные вещи.','Если фильм пугает тебя лишь вещами, злоупотребляющими человеческими инстинктами, он ни разу не захватывающий и просто скучный.','Однако с книгами всё обстоит иначе.','История должна быть написана настолько изобразительным языком, чтобы в голове читателя появились тревожные образы.','Автору нужно их тесно сплести с сюжетом и персонажами, и тогда он сможет как угодно играться с твоим разумом.','На мой взгляд, не бывает ничего страшнее вещей, в которых присутствует всего толика ненормальности.','Например, сначала ты выстраиваешь декорации, формируя у читателя ожидания того, какой будет история…','…А затем шаг за шагом начинаешь эту сцену разбирать по кусочкам и выворачивать вещи наизнанку.','Так что даже если история и не пытается быть пугающей, то читатель чувствует себя очень неуютно.','Он словно ждёт, что нечто ужасное притаилось за этими треснутыми декорациями, готовое выпрыгнуть на него.','Боже, у меня мурашки по коже от одной мысли об этом.','Вот такой хоррор я могу оценить по достоинству.','Но тебе, наверное, больше нравятся романтические игры, да?','А-ха-ха, не волнуйся.','Я не собираюсь в ближайшее время заставлять тебя читать ужастики.','Я ничего не имею против, если мы сосредоточимся на романтике~'],
['Знаешь один классный литературный жанр?','Рэп!','На самом деле я раньше терпеть его не могла…','Возможно, просто потому, что он был дико популярен, а я слушала всякую ерунду, что крутили по радио.','Но несколько моих друзей им сильно увлеклись, и это помогло побороть собственную предвзятость.','Порой рэп может бросать ещё больший вызов, чем поэзия.','В строках у тебя должна сохраняться рифма, кроме того нужно делать особый акцент на игре слов…','Когда людям удаётся всего этого достичь и донести до окружающих глубокую мысль, я считаю, что это потрясающе.','Я даже хотела бы, чтобы в нашем клубе был рэпер.','А-ха-ха! Прости, знаю, это звучит глупо, но мне было бы правда интересно узнать, что бы он для нас приготовил.','Это серьёзно был бы полезный опыт!'],
['Э-хе-хе. Юри однажды такую штуку выкинула.','Мы как-то сидели в клубе, расслаблялись, болтали, всё как обычно…','И тут Юри, словно из ниоткуда, вытаскивает маленькую бутылку вина.','И я не шучу!','И она такая: «Вина кто-нибудь хочет попробовать?»','Нацуки громко захохотала, а Сайори стала кричать на неё.','Мне стало даже жаль её, ведь она старалась быть милой…','Думаю, после этого случая она стала ещё более замкнутой.','Хотя мне кажется, что Нацуки было любопытно и она была бы не прочь попробовать…','…И, если уж совсем откровенно, я тоже.','Было бы довольно забавно!','Но ты ведь понимаешь: президентская ответственность, все дела – я не могла такое позволить.','Может, если бы мы встретились где-нибудь за пределами школы, но до этого наша дружба не дошла…','…Господи, зачем я обо всём этом разговариваю?','Я не одобряю распитие спиртных напитков несовершеннолетними!','То есть я и сама не выпивала никогда, так что… вот.'],
['Я представляю, сколькими романтичными вещами мы могли бы заняться, если бы пошли на свидание…','Мы могли бы пообедать, посидеть в кафе…','Пойти вместе за покупками…','Я люблю выбирать юбки и бантики.','Или в книжный магазин!','Подходящее место, согласен?','Хотя с превеликим удовольствием сходила бы в кондитерскую.','У них столько бесплатных образцов. А-ха-ха!','И, разумеется, потом мы пошли бы в кино…','Боже, это выглядит как настоящее воплощение мечты в реальность.','Когда ты рядом, мне весело, что бы мы ни делали.','Я так рада, что я твоя девушка, [player].','Ты обязательно будешь мной гордиться~'],
['А? Ты с-сказал… п… поцелуй?','Это так внезапно… я немного смущаюсь…','Но… с тобой… я не против…','…А-ха-ха! Уф, прости…','Я не смогла сохранить серьёзное лицо.','Так говорят девушки во всех этих симуляторах свиданий, да?','И не ври, что это тебя хоть немного не завело.','А-ха-ха! Шучу.','Ну, если честно, я становлюсь романтичной, когда обстановка располагает…','Но это будет наш секрет~'],
['Ты когда-нибудь слышал термин «яндере»?','Это такой тип личности, когда девушка сделает всё, что угодно, чтобы быть с тобой, настолько она одержима.','Как правило, они сумасшедшие…','Они могут преследовать и следить за тобой, чтобы ты не проводил время с кем-то ещё.','Ради достижения своей цели они даже могут причинить вред тебе и твоим друзьям…','И, кстати, в этой игре есть одна особа, которая, в принципе, подходит под это описание.','Ты уже, скорее всего, догадался, о ком я говорю.','И гвоздь программы – это…','Юри!','Как только она чуть-чуть тебе открылась, у неё стала развиваться к тебе маниакальная привязанность.','Она даже как-то сказала мне убить себя.','Я тогда своим ушам не поверила, мне ничего не оставалось, как уйти.','Но, вспоминая об этом сейчас, получилось довольно иронично. А-ха-ха!','Так вот, я к тому, что…','Многим нравятся яндере, ты знал об этом?','Видимо, таким людям льстит то, что ими кто-то одержим.','Люди такие странные! Хотя не мне судить!','Возможно, даже я немного одержима тобой, но я далеко не сумасшедшая…','Как оказалось, всё совсем наоборот.','Получилось так, что я – единственная нормальная в этой игре.','Да, я всех удалила, но я никогда не убила бы человека…','Меня трясёт от одной этой мысли.','А что до игр… люди там постоянно убивают друг друга направо и налево.','Что, это делает тебя психом? Разумеется нет.','Но, если тебе вдруг тоже нравятся яндере…','Ради тебя я могу постараться вести себя более жутко. Э-хе-хе~','Но опять же…','Здесь тебе уже некуда ходить, а мне – не к кому тебя ревновать.','Может, так и выглядит мечта девушки-яндере?','Хотелось бы мне спросить Юри об этом.'],
['Давненько я уже кое-чего не говорила, так что…','…пора вспомнить былое!','Вот тебе писательский совет дня от Моники!','Иногда люди, впечатлившись моим творчеством, говорят что-то вроде: «У меня бы никогда так не получилось».','Ты знаешь, на самом деле меня очень печалят эти слова.','Как человеку, который больше всего любит делиться радостью открытий новых горизонтов своего творчества…','…мне больно, когда люди считают, что кому-то просто повезло и он талантлив с рождения.','И это относится вообще ко всему, не только к писательству.','Когда ты делаешь что-то впервые, скорее всего ничего путного не выйдет.','Иногда, когда заканчиваешь работу, очень гордишься собой и хочешь со всеми ею поделиться.','Но, вернувшись к работе через несколько недель, ты уже видишь все её недостатки.','Со мной это происходит постоянно.','Ты можешь испытывать очень горькое разочарование, вложив уйму усилий во что-то, чтобы в результате осознать, что получилась дребедень.','Но это происходит постоянно, когда ты сравниваешь себя с профессионалами.','Когда ты стремишься дотянуться до звёзд, они всегда будут оставаться вне твоей досягаемости, понимаешь?','Смысл в том, чтобы продвигаться вперёд небольшими шагами.','И, как только достигнешь первого важного рубежа, надо оглянуться и посмотреть, сколько ты уже прошёл…','А затем посмотреть вперёд и оценить, сколько ещё тебе предстоит пройти.','Поэтому иногда полезно понизить планку…','Найти что-нибудь, что считаешь достойным вызовом, но не нечто мирового уровня.','И ты можешь сделать это своей личной целью.','Также важно понимать объём работ, который тебе предстоит выполнить.','Попытавшись взвалить на себя огромный проект, будучи новичком, ты никогда его не закончишь.','Написание романа может стать непосильной задачей, если у тебя нет опыта.','Так почему бы не начать с коротких историй?','Лучшее в коротких рассказах то, что ты можешь сосредоточиться на том, что хочешь сделать правильно.','Это касается всех маленьких проектов, ты концентрируешься на важнейших вещах.','Ты приобретаешь полезный опыт и делаешь шаг вперёд.','И ещё кое-что…','Сочинительство – это не просто прислушаться к своему сердцу, чтобы в итоге написать нечто прекрасное.','Точно так же, как в живописи или музыке, тебе придётся развивать свой навык, чтобы правильно выразить то, что у тебя внутри.','А это значит, что сперва придётся положиться на методики, руководства и основы!','Чтение обучающей литературы поможет открыть тебе глаза на многие вещи.','Планирование и организация работы позволят тебе избежать завала и дойти до конца.','Ты не заметишь, как мало-помалу…','Будешь становиться всё лучше и лучше.','Ничто не приходит просто так.','И наше общество, и наше искусство построены на тысячелетиях человеческого развития.','Если ты возьмёшь этот принцип на вооружение и будешь постепенно продвигаться к своей цели…','Ты тоже сможешь творить удивительные вещи.','…И это был мой совет на сегодня!','Спасибо за внимание~'],
['Ненавижу, как сложно формируются хорошие привычки…','Есть куча вещей, которые сделать проще простого, но кажется невозможным, чтобы это вошло в привычку.','Как результат, ты чувствуешь себя совершенно бесполезным, словно ничего не можешь сделать правильно.','Думаю, от этого больше всего страдает молодое поколение…','Должно быть, это потому, что у нас совершенно другой набор навыков, нежели у тех, кто был до нас.','Благодаря интернету мы быстро научились отфильтровывать тонны информации…','Однако мы плохо справляемся с задачами, от выполнения которых не получаем немедленного вознаграждения.','Думаю, если наука, психология и образование не смогут за следующие десять-двадцать лет догнать технологический прогресс, у нас будут большие проблемы.','А пока…','Если ты не один из тех людей, кто способен совладать с проблемой, тебе придётся мириться с постоянным чувством разочарования.','Желаю удачи!'],
['Знаешь, быть творческой личностью – полный отстой…','У меня всегда такое чувство, что они вкалывают как проклятые, практически ничего не получая взамен.','Я имею в виду художников, писателей, актёров…','Это грустно, ведь в мире столько прекрасных талантов, но большинство из них остаются в тени… и в бедности.','Полагаю, это означает, что мы имеем избыток творчества, да?','Но из-за этого получается, что ты вовсе не особенный…','Ну и пусть! Это лишь говорит о том, что тебе нужно просто писать для самого себя, верно?','Да…'],
['Я очень люблю звуки дождя…','А вот когда промокает одежда или волосы – не очень.','Другое дело, тихий день дома и звуки дождя за окном…','Для меня это самая расслабляющая обстановка.','Да…','Иногда я представляю, что нахожусь в твоих объятиях, пока мы прислушиваемся к падающим за окном каплям.','Это ведь не слишком слащаво звучит, я надеюсь?','[player], ты бы сделал это для меня, правда?'],

function runTerminalSequence(seq,onComplete) { let i=0; function next() { if(i>=seq.length){ if(onComplete) onComplete(); return; } const line=seq[i]; if(line.action){ try{ line.action(); }catch(e){} } if(line.text==='') terminalContent.appendChild(document.createElement('br')); else { const span=document.createElement('span'); span.textContent=applyGender(line.text || ''); terminalContent.appendChild(span); if(line.blinking){ const cursor=document.createElement('span'); cursor.className='cursor-blink'; cursor.textContent='█'; terminalContent.appendChild(cursor); } } terminalContent.appendChild(document.createElement('br')); terminalOverlay.scrollTop=terminalOverlay.scrollHeight; i++; if(i<seq.length) setTimeout(next,line.delay); else if(onComplete) onComplete(); } next(); }
function startGame() {

if(state.act3&&isFileDeleted('monika')&&!isStoryDeleted('monika')){ titleScreen.classList.remove('show'); runAct3Finale(); return; }
state.paused=false; state.started=true;
if(state.act3) playTrack(act3Theme); else playGameBg();
titleScreen.classList.remove('show');
nextMarker.onclick=(e)=>{ e.stopPropagation(); advance(); };
document.getElementById('dialogueBox').style.display=''; document.getElementById('nextMarker').style.display='';
updateAllUI();
if(activeSteps.length===0){
if(state.act2){ currentScript=scriptAct2; dayIndex=0; startDay(0); }
else if(state.act3){ currentScript=scriptAct3; dayIndex=0; startDay(0); }
else if(state.act4){ currentScript=scriptAct4; dayIndex=0; startDay(0); }
else { currentScript=scriptAct1; dayIndex=0; startDay(0); }
} else renderCurrentStep();
return;
}
if(state&&state.act3Menu){ alert(td('Акт 3 ещё не реализован.','Act 3 is not implemented yet.')); return; }
if(state&&state.act4Menu){ alert(td('Акт 4 ещё не реализован.','Act 4 is not implemented yet.')); return; }
if(state&&state.act2Menu){ startAct2(); return; }
if(state&&state.started){ titleScreen.classList.remove('show'); if(bgGameMusic.paused){ if(state.act3) playTrack(act3Theme); else playGameBg(); } return; }
if(getFlag(FLAG_REVENGE)&&allFilesDeleted()){ showSpecialEnd('revenge'); return; }
if(isFileDeleted('monika')||allFilesDeleted()){ playRevengeSequence(); return; }
if(isFileDeleted('sayori')){ playSayoriQuickEnd(); return; }
playGameBg(); state=freshState(); state.started=true; dayBgOverride=null;
bodyEl.classList.remove('corrupted','glitch'); staticOverlay.style.opacity='0'; titleScreen.classList.remove('show');
nextMarker.onclick=(e)=>{ e.stopPropagation(); advance(); }; currentScript=scriptAct1;
document.getElementById('dialogueBox').style.display=''; document.getElementById('nextMarker').style.display='';
updateAllUI(); startDay(0);
}

const petalsCanvas = document.getElementById('petalsCanvas');
const pctx = petalsCanvas.getContext('2d');
let petals = [];
function resizePetals(){ petalsCanvas.width = window.innerWidth; petalsCanvas.height = window.innerHeight; }
window.addEventListener('resize', resizePetals);
resizePetals();
function petalsEnabled(){
if (bodyEl.classList.contains('glitch') || bodyEl.classList.contains('corrupted')) return false;
if (state && (state.act2 || state.act3)) return false;
if (titleScreen.classList.contains('show')) return true;
if (state && state.started) return true;
return false;
}
function newPetal(){
return { x: Math.random()*petalsCanvas.width, y: -20, size: 4+Math.random()*6, vy: 0.6+Math.random()*1.1, vx: -0.3+Math.random()*0.6, rot: Math.random()*Math.PI*2, vr: -0.02+Math.random()*0.04, sway: Math.random()*Math.PI*2, swayV: 0.012+Math.random()*0.02, hue: 335+Math.random()*25, alpha: 0.3+Math.random()*0.4 };
}
function tickPetals(){
requestAnimationFrame(tickPetals);
pctx.clearRect(0,0,petalsCanvas.width,petalsCanvas.height);
if(!petalsEnabled()){ if(petals.length) petals=[]; return; }
if(petals.length<42 && Math.random()<0.12) petals.push(newPetal());
for(let i=petals.length-1;i>=0;i--){
const p=petals[i];
p.sway+=p.swayV; p.x+=p.vx+Math.sin(p.sway)*0.7; p.y+=p.vy; p.rot+=p.vr;
if(p.y>petalsCanvas.height+24||p.x<-30||p.x>petalsCanvas.width+30){ petals.splice(i,1); continue; }
pctx.save();
pctx.translate(p.x,p.y);
pctx.rotate(p.rot);
pctx.scale(1, 0.6+Math.sin(p.sway)*0.25);
pctx.beginPath();
pctx.ellipse(0,0,p.size,p.size*0.62,0,0,Math.PI*2);
pctx.fillStyle='hsla('+p.hue+',85%,82%,'+p.alpha+')';
pctx.fill();
pctx.restore();
}
}
tickPetals();

let deferredInstallPrompt = null;
let installBtn = null;
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
const installModalOverlay = document.getElementById('installModalOverlay');
const installModalBody = document.getElementById('installModalBody');
const installModalClose = document.getElementById('installModalClose');
function createInstallButton() {
if (installBtn || isStandalone) return;
installBtn = document.createElement('button');
installBtn.id = 'installPwaBtn';
installBtn.textContent = t('installApp');
installBtn.addEventListener('click', async (e) => {
e.stopPropagation();
if (isIOS) { showIOSInstructions(); return; }
if (deferredInstallPrompt) {
installBtn.style.opacity = '0.6';
installBtn.disabled = true;
try {
deferredInstallPrompt.prompt();
const { outcome } = await deferredInstallPrompt.userChoice;
if (outcome === 'accepted') {
installBtn.textContent = t('installed');
installBtn.style.background = '#1e8449';
setTimeout(() => { if (installBtn && installBtn.parentNode) installBtn.remove(); installBtn = null; }, 2000);
} else {
installBtn.style.opacity = '1';
installBtn.disabled = false;
}
} catch (err) {
installBtn.style.opacity = '1';
installBtn.disabled = false;
showAndroidInstructions();
}
deferredInstallPrompt = null;
} else {
showAndroidInstructions();
}
});
const menuBtns = document.querySelector('#titleScreen .menu-buttons');
if (menuBtns) menuBtns.appendChild(installBtn);
}
function showIOSInstructions() {
installModalBody.innerHTML = currentLang === 'ru'
? '<ol><li>Нажмите кнопку <strong>«Поделиться»</strong> внизу Safari<br><span style="font-size:0.85em;color:#bbb;">(квадрат со стрелкой вверх ⬆)</span></li><li>Прокрутите вниз и выберите <strong>«На экран Домой»</strong></li><li>Нажмите <strong>«Добавить»</strong> в правом верхнем углу</li></ol><div class="ios-note">⚠ Работает только в Safari. В Chrome/Firefox на iOS установка невозможна.</div>'
: '<ol><li>Tap the <strong>Share</strong> button at the bottom of Safari<br><span style="font-size:0.85em;color:#bbb;">(square with an up arrow ⬆)</span></li><li>Scroll down and tap <strong>"Add to Home Screen"</strong></li><li>Tap <strong>"Add"</strong> in the top-right corner</li></ol><div class="ios-note">⚠ Works only in Safari. Install is not possible in Chrome/Firefox on iOS.</div>';
installModalOverlay.classList.add('active');
}
function showAndroidInstructions() {
installModalBody.innerHTML = currentLang === 'ru'
? '<ol><li>Откройте меню браузера <strong>⋮</strong> (три точки в правом верхнем углу)</li><li>Выберите <strong>«Установить приложение»</strong> или <strong>«Добавить на главный экран»</strong></li><li>Подтвердите установку</li></ol><div class="ios-note">💡 Если пункт не появляется, попробуйте открыть сайт в Chrome и повторить.</div>'
: '<ol><li>Open the browser menu <strong>⋮</strong> (three dots in the top-right corner)</li><li>Select <strong>"Install app"</strong> or <strong>"Add to Home Screen"</strong></li><li>Confirm the installation</li></ol><div class="ios-note">💡 If the option does not appear, try opening the site in Chrome and try again.</div>';
installModalOverlay.classList.add('active');
}
installModalClose.addEventListener('click', () => { installModalOverlay.classList.remove('active'); });
installModalOverlay.addEventListener('click', (e) => { if (e.target === installModalOverlay) installModalOverlay.classList.remove('active'); });
window.addEventListener('beforeinstallprompt', (e) => {
e.preventDefault();
deferredInstallPrompt = e;
createInstallButton();
});
window.addEventListener('appinstalled', () => {
if (installBtn && installBtn.parentNode) {
installBtn.textContent = t('installed');
installBtn.style.background = '#1e8449';
setTimeout(() => { if (installBtn && installBtn.parentNode) installBtn.remove(); installBtn = null; }, 2000);
}
deferredInstallPrompt = null;
});
createInstallButton();
})();
