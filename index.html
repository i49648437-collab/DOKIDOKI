                typeText(t('pleaseStop'));
                setTimeout(() => {
                    document.body.style.background = '#000';
                    document.getElementById('gameContainer').style.display = 'none';
                    setTimeout(() => {
                        document.body.style.background = '';
                        document.getElementById('gameContainer').style.display = '';
                        updateScene('death', IMG.deadSayori);
                        typeText(t('everyoneHappy'));
                        state.started = false;
                        setTimeout(() => goToMenuActTwo(), 8000);
                    }, 3000);
                }, 3000);
            }
            function showQuickEndAll() {
                stopAllMusic();
                document.body.style.background = '#000';
                document.getElementById('gameContainer').style.display = 'none';
                setTimeout(() => {
                    document.body.style.background = '';
                    document.getElementById('gameContainer').style.display = '';
                    updateScene('death', IMG.deadSayori);
                    typeText(t('end') + ' — ' + t('everyoneHappy'));
                    state.started = false;
                    setTimeout(() => goToMenuActTwo(), 10000);
                }, 4000);
            }
            // Проводник
            const explorerOverlay = document.getElementById('explorerModalOverlay');
            const fileListContainer = document.getElementById('fileListContainer');
            const explorerCloseBtn = document.getElementById('explorerCloseBtn');
            const explorerCloseFooter = document.getElementById('explorerCloseFooter');
            const explorerButton = document.getElementById('explorerButton');
            function openExplorer() { refreshExplorerModal(); explorerOverlay.classList.add('active'); }
            function closeExplorer() { explorerOverlay.classList.remove('active'); }
            explorerCloseBtn.addEventListener('click', closeExplorer);
            explorerCloseFooter.addEventListener('click', closeExplorer);
            explorerOverlay.addEventListener('click', (e) => { if (e.target === explorerOverlay) closeExplorer(); });
            explorerButton.addEventListener('click', (e) => { e.stopPropagation(); openExplorer(); });

            const charFiles = [
                { key: 'sayori', name: 'sayori.chr', storyFlag: 'deletedSayoriStory', deletedFlag: 'deletedSayori' },
                { key: 'yuri', name: 'yuri.chr', storyFlag: 'deletedYuriStory', deletedFlag: 'deletedYuri' },
                { key: 'natsuki', name: 'natsuki.chr', storyFlag: 'deletedNatsukiStory', deletedFlag: 'deletedNatsuki' },
                { key: 'monika', name: 'monika.chr', storyFlag: 'deletedMonikaStory', deletedFlag: 'deletedMonika' }
            ];
            function refreshExplorerModal() {
                fileListContainer.innerHTML = '';
                if (!state) return;
                charFiles.forEach(file => {
                    const isDeleted = state[file.deletedFlag];
                    const isStoryDeleted = state[file.storyFlag];
                    const div = document.createElement('div');
                    div.className = 'file-item';
                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'file-name';
                    nameSpan.textContent = file.name + (isDeleted ? ' (удалён)' : '');
                    div.appendChild(nameSpan);
                    const actionsDiv = document.createElement('div');
                    actionsDiv.className = 'file-actions';
                    if (isDeleted) {
                        const restoreBtn = document.createElement('button');
                        restoreBtn.className = 'restore-btn';
                        restoreBtn.textContent = t('restoreFile');
                        restoreBtn.disabled = isStoryDeleted;
                        restoreBtn.title = isStoryDeleted ? t('storyDeleteDenied') : '';
                        restoreBtn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            if (isStoryDeleted) {
                                showToast(t('storyDeleteDenied'));
                                return;
                            }
                            state[file.deletedFlag] = false;
                            saveCharDeletions(state);
                            refreshExplorerModal();
                            showToast(file.name + ' ' + t('restoreFile'));
                        });
                        actionsDiv.appendChild(restoreBtn);
                    } else {
                        const deleteBtn = document.createElement('button');
                        deleteBtn.className = 'delete-btn';
                        deleteBtn.textContent = t('deleteFile');
                        deleteBtn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            state[file.deletedFlag] = true;
                            saveCharDeletions(state);
                            refreshExplorerModal();
                            showToast(file.name + ' ' + t('deleteFile'));
                        });
                        actionsDiv.appendChild(deleteBtn);
                    }
                    div.appendChild(actionsDiv);
                    fileListContainer.appendChild(div);
                });
            }
            updateAllUI();
        })();
    </script>
    <script> /* анти-дебаг и service worker без изменений */ </script>
</body>
</html>
