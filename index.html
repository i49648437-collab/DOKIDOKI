    function typeText(text, glitch=false) { dialogueText.innerHTML=''; if(glitch) text=glitchText(text); const frag=document.createDocumentFragment(); [...text].forEach((ch,i)=>{ const span=document.createElement('span'); span.className='char'; span.textContent=ch; span.style.animationDelay=(i*12)+'ms'; frag.appendChild(span); }); dialogueText.appendChild(frag); }
    function glitchText(text) { return text.split('').map(c=>{ if(Math.random()<0.2) return String.fromCharCode(33+Math.floor(Math.random()*94)); if(Math.random()<0.1) return '█'; return c; }).join(''); }
    function getStepText(step) { if(!step) return ''; return currentLang==='en'?(step.en||step.text):step.text; }
    function renderCurrentStep() { if(stepIndex>=activeSteps.length){ finishDay(); return; } const step=activeSteps[stepIndex]; if(!step){ stepIndex++; renderCurrentStep(); return; } if(step.type==='line'){ updateScene(step.speaker,step.bg||dayBgOverride); typeText(getStepText(step),step.glitch||false); clearChoices(); showNext(true); return; } if(step.type==='choice'){ showNext(false); clearChoices(); step.options.forEach(opt=>{ const label=currentLang==='en'?(opt.enLabel||opt.label):opt.label; addChoice(label,()=>{ opt.apply(state); const resolvedLines=opt.lines.map(l=>({type:'line',...l})); activeSteps.splice(stepIndex,1,...resolvedLines); renderCurrentStep(); }); }); return; } if(step.type==='poemgame'){ renderPoemGame(); return; } if(step.type==='effect'){ handleEffect(step.effect); return; } if(step.type==='jump'){ if(step.target==='act3_menu'){ goToMenuActThree(); return; } stepIndex++; renderCurrentStep(); return; } stepIndex++; renderCurrentStep(); }
    function handleEffect(effect) { switch(effect) { case 'delete_characters': staticOverlay.style.opacity='0.9'; setSprite(null); playGlitch(); break; default: console.log('Unknown effect:',effect); } stepIndex++; renderCurrentStep(); }
    const poemWords = [ { word:'котёнок', enWord:'kitten', tag:'natsuki' }, { word:'кекс', enWord:'cupcake', tag:'natsuki' }, { word:'улыбка', enWord:'smile', tag:'sayori' }, { word:'солнце', enWord:'sun', tag:'sayori' }, { word:'праздник', enWord:'party', tag:'sayori' }, { word:'тень', enWord:'shadow', tag:'yuri' }, { word:'бездна', enWord:'abyss', tag:'yuri' }, { word:'тишина', enWord:'silence', tag:'yuri' }, { word:'книга', enWord:'book', tag:'yuri' }, { word:'смех', enWord:'laughter', tag:'natsuki' } ];
    function renderPoemGame() { updateScene('narrator',IMG.poemBg); speakerName.textContent=t('poemGameTitle'); typeText(t('poemPrompt')); showNext(false); clearChoices(); const words=state.act2?poemWords.filter(w=>w.tag!=='sayori'):poemWords; const selected=[]; const confirmBtn=document.createElement('button'); confirmBtn.className='choice-btn'; confirmBtn.textContent=t('ready')+' (0/5)'; confirmBtn.disabled=true; confirmBtn.style.opacity='0.5'; words.forEach(item=>{ const btn=document.createElement('button'); btn.className='choice-btn'; btn.textContent=currentLang==='en'?item.enWord:item.word; btn.onclick=(e)=>{ e.stopPropagation(); const idx=selected.indexOf(item); if(idx>=0){ selected.splice(idx,1); btn.style.background=''; }else if(selected.length<5){ selected.push(item); btn.style.background='#d7ccc8'; } confirmBtn.textContent=t('ready')+` (${selected.length}/5)`; confirmBtn.disabled=selected.length!==5; confirmBtn.style.opacity=selected.length===5?'1':'0.5'; }; choicesArea.appendChild(btn); }); confirmBtn.onclick=(e)=>{ e.stopPropagation(); if(selected.length!==5) return; clearChoices(); const counts={}; selected.forEach(w=>{ counts[w.tag]=(counts[w.tag]||0)+1; }); let winner='sayori',max=-1; Object.keys(counts).forEach(tag=>{ if(counts[tag]>max){ max=counts[tag]; winner=tag; } }); if(state.act2) state.routeAct2=winner; else state.route=winner; const reactions={ natsuki:{ ru:'Хм… а неплохо!', en:'Hm… not bad!' }, yuri:{ ru:'Очень… глубоко.', en:'Very… profound.' }, sayori:{ ru:'Вау, как мило!', en:'Wow, how cute!' } }; const reactionText=currentLang==='en'?reactions[winner].en:reactions[winner].ru; const resultStep={ type:'line', speaker:winner, text:reactionText, en:reactions[winner].en }; activeSteps.splice(stepIndex,1,resultStep); renderCurrentStep(); }; choicesArea.appendChild(confirmBtn); }
    function advance() { if(!state||!state.started) return; if(choicesArea.children.length>0) return; const step=activeSteps[stepIndex]; if(step&&step.type==='line'){ stepIndex++; renderCurrentStep(); } }
    function startDay(idx) { dayIndex=idx; const day=currentScript[idx]; showDayTransition(day.title); activeSteps=day.steps(); stepIndex=0; if(day.onEnter) day.onEnter(); renderCurrentStep(); setTimeout(()=>autosave(),1800); }
    function finishDay() { const day=currentScript[dayIndex]; if(day.onComplete){ day.onComplete(state); return; } if(dayIndex+1<currentScript.length) startDay(dayIndex+1); }
    function badEnding() { stopAllMusic(); deathMusic.play().catch(e=>{}); updateScene('death'); typeText(td('Сайори повесилась…','Sayori hanged herself…')); bodyEl.classList.add('corrupted'); staticOverlay.style.opacity='0.9'; showNext(false); clearChoices(); setTimeout(()=>{ transitionToActTwoBad(); },5000); }
    function goodEnding() { stopAllMusic(); playGameBg(); updateScene('sayori',IMG.festivalRoom); const lines=[ { speaker:'sayori', text:'Я пришла на фестиваль! Спасибо тебе.', en:'I came to the festival! Thank you.' } ]; activeSteps=lines.map(l=>({type:'line',...l})); stepIndex=0; dayIndex=-1; const onDialogueComplete=()=>{ document.getElementById('dialogueBox').style.display='none'; nextMarker.style.display='none'; transitionToActTwo(); }; renderCurrentStepWithEnd(onDialogueComplete); }
    function renderCurrentStepWithEnd(onEnd) { function step() { if(stepIndex>=activeSteps.length){ onEnd(); return; } const s=activeSteps[stepIndex]; updateScene(s.speaker,IMG.festivalRoom); typeText(getStepText(s)); showNext(true); } nextMarker.onclick=(e)=>{ e.stopPropagation(); stepIndex++; step(); }; step(); }
    function goToMenuActTwo() { stopAllMusic(); if(!state) state=freshState(); state.started=false; state.paused=true; state.act2=true; state.act2Menu=false; state.act3=false; state.act3Menu=false; activeSteps=[]; stepIndex=0; dayIndex=0; dayBgOverride=null; bodyEl.classList.remove('corrupted','glitch'); staticOverlay.style.opacity='0'; setBg(IMG.titleAct2); setSprite(null); speakerName.textContent=''; typeText(t('clickToStart')); clearChoices(); showNext(false); nextMarker.onclick=null; titleScreen.classList.add('show'); document.getElementById('dialogueBox').style.display=''; document.getElementById('nextMarker').style.display=''; titleMusic.play().catch(()=>{}); updateAllUI(); if(saveModalOverlay.classList.contains('active')) closeSaveModal(); }
    function goToMenuActThree() { stopAllMusic(); if(!state) state=freshState(); state.started=false; state.paused=true; state.act3=true; state.act3Menu=false; state.act2=false; activeSteps=[]; stepIndex=0; dayIndex=0; bodyEl.classList.remove('corrupted','glitch'); staticOverlay.style.opacity='0'; setBg(IMG.titleAct3); setSprite(null); speakerName.textContent=''; typeText(t('clickToStart')); clearChoices(); showNext(false); nextMarker.onclick=null; titleScreen.classList.add('show'); document.getElementById('dialogueBox').style.display=''; document.getElementById('nextMarker').style.display=''; updateAllUI(); if(saveModalOverlay.classList.contains('active')) closeSaveModal(); }
    function chooseTitleBg() { if(Math.random()<0.01) return IMG.titleAlt1; return IMG.title; }
    function transitionToActTwo() { markFileDeletedByStory('sayori'); terminalOverlay.style.display='block'; terminalContent.innerHTML=''; const seq=[ { text:'Первый Акт пройден, переход на второй...', delay:2500 }, { text:'> del sayori.chr', delay:1500 }, { text:'sayori.chr успешно удалён.', delay:1500 } ]; runTerminalSequence(seq,()=>{ setTimeout(()=>goToMenuActTwo(),10000); }); stopAllMusic(); }
    function transitionToActTwoBad() { markFileDeletedByStory('sayori'); document.getElementById('dialogueBox').style.display='none'; nextMarker.style.display='none'; terminalOverlay.style.display='block'; terminalContent.innerHTML=''; terminalBgImage.style.backgroundImage=`url("${IMG.deadSayori}")`; terminalBgImage.style.opacity='1'; const seq=[ { text:'Первый Акт пройден... Ты ужасен...', delay:3200 }, { text:'> del sayori.chr', delay:1500 }, { text:'sayori.chr успешно удалён.', delay:1500 } ]; runTerminalSequence(seq,()=>{ setTimeout(()=>goToMenuActTwo(),10000); }); stopAllMusic(); }
    function runTerminalSequence(seq,onComplete) { let i=0; function next() { if(i>=seq.length){ if(onComplete) onComplete(); return; } const line=seq[i]; const span=document.createElement('span'); span.textContent=line.text; terminalContent.appendChild(span); terminalContent.appendChild(document.createElement('br')); i++; if(i<seq.length) setTimeout(next,line.delay); else if(onComplete) onComplete(); } next(); }

    function updateAllUI() {
      document.getElementById('titleHeading').textContent = t('title');
      const startBtn = document.getElementById('startButton');
      if (state && state.paused && state.act2) startBtn.textContent = t('continue');
      else if (state && state.paused && state.act3) startBtn.textContent = t('continue');
      else if (state && state.act2Menu) startBtn.textContent = t('startAct2');
      else if (state && state.act3Menu) startBtn.textContent = t('startAct3');
      else startBtn.textContent = t('startGame');
      document.getElementById('saveButton').textContent = t('save');
      document.getElementById('loadButton').textContent = t('load');
      document.getElementById('menuButton').textContent = t('menu');
      document.getElementById('modalTitle').textContent = t('savesTitle');
      document.getElementById('modalCloseFooter').textContent = t('close');
      document.getElementById('nextMarker').textContent = t('continue_');
      document.getElementById('langButton').textContent = currentLang === 'ru' ? '🌐 EN' : '🌐 RU';
      document.getElementById('videoPromptText').textContent = t('videoWelcome');
      document.getElementById('startVideoBtn').textContent = t('watchIntro');
      document.getElementById('skipHint').textContent = t('skipHint');
      if (!state || !state.started) document.getElementById('dialogueText').textContent = t('clickToStart');
      document.documentElement.lang = currentLang;
      const showExplorer = state && !state.started && titleScreen.classList.contains('show');
      explorerButton.style.display = showExplorer ? 'block' : 'none';
      refreshSaveModal();
    }

    function startGame() {
      if(state&&state.paused){ state.paused=false; state.started=true; stopAllMusic(); playGameBg(); titleScreen.classList.remove('show'); nextMarker.onclick=(e)=>{ e.stopPropagation(); advance(); }; document.getElementById('dialogueBox').style.display=''; document.getElementById('nextMarker').style.display=''; updateAllUI(); if(activeSteps.length===0){ if(state.act2){ currentScript=scriptAct2; dayIndex=0; startDay(0); } else if(state.act3){ currentScript=scriptAct3; dayIndex=0; startDay(0); } else { currentScript=scriptAct1; dayIndex=0; startDay(0); } } else renderCurrentStep(); return; }
      if(state&&state.act3Menu){ alert('Акт 3 ещё не реализован.'); return; }
      if(state&&state.act2Menu){ startAct2(); return; }
      if(!state){ state=freshState(); }
      if(!state.started){ checkFilesAndStart(); return; }
      titleScreen.classList.remove('show'); if(bgGameMusic.paused){ stopAllMusic(); playGameBg(); }
    }
    function startAct2() { stopAllMusic(); playGameBg(); state=freshState(); state.started=true; state.act2=true; state.act2Menu=false; dayBgOverride=null; bodyEl.classList.remove('corrupted','glitch'); staticOverlay.style.opacity='0'; titleScreen.classList.remove('show'); nextMarker.onclick=(e)=>{ e.stopPropagation(); advance(); }; currentScript=scriptAct2; document.getElementById('dialogueBox').style.display=''; document.getElementById('nextMarker').style.display=''; updateAllUI(); startDay(0); }

    startButton.addEventListener('click',(e)=>{ e.stopPropagation(); startGame(); });
    document.getElementById('dialogueBox').addEventListener('click',(e)=>{ if(e.target.tagName!=='BUTTON'&&nextMarker.onclick) nextMarker.onclick(e); });
    sceneArea.addEventListener('click',(e)=>{ if(e.target===startButton||e.target.classList.contains('save-load-btn')||e.target.classList.contains('lang-btn')||e.target.classList.contains('explorer-btn')) return; if(nextMarker.onclick) nextMarker.onclick(e); });
    document.getElementById('saveButton').addEventListener('click',(e)=>{ e.stopPropagation(); if(!state||!state.started){ showToast(t('cannotSaveNow')); return; } openSaveModal(); });
    document.getElementById('loadButton').addEventListener('click',(e)=>{ e.stopPropagation(); openSaveModal(); });
    document.getElementById('langButton').addEventListener('click',(e)=>{ e.stopPropagation(); currentLang = currentLang === 'ru' ? 'en' : 'ru'; updateAllUI(); if(state&&state.started&&stepIndex<activeSteps.length) renderCurrentStep(); });
    document.getElementById('menuButton').addEventListener('click',(e)=>{ e.stopPropagation(); if(!state||!state.started) return; if(!confirm(t('backToMenu'))) return; autosave(); state.paused=true; state.started=false; stopAllMusic(); titleMusic.play().catch(()=>{}); titleScreen.classList.add('show'); if(state.act2) setBg(IMG.titleAct2); else if(state.act3) setBg(IMG.titleAct3); else setBg(chooseTitleBg()); setSprite(null); speakerName.textContent=''; typeText(t('clickToStart')); clearChoices(); showNext(false); nextMarker.onclick=null; bodyEl.classList.remove('corrupted','glitch'); staticOverlay.style.opacity='0'; document.getElementById('dialogueBox').style.display=''; document.getElementById('nextMarker').style.display=''; updateAllUI(); if(saveModalOverlay.classList.contains('active')) closeSaveModal(); });
    explorerButton.addEventListener('click',(e)=>{ e.stopPropagation(); openExplorer(); });
    document.addEventListener('keydown',function(e){
      if(e.key===' '||e.keyCode===32){ e.preventDefault(); if(titleScreen.classList.contains('show')){ startGame(); return; } if(!state||!state.started) return; const readyBtn=Array.from(choicesArea.querySelectorAll('button.choice-btn')).find(btn=>btn.textContent.startsWith(t('ready'))&&!btn.disabled); if(readyBtn){ readyBtn.click(); return; } if(choicesArea.children.length===0&&nextMarker.onclick&&!nextMarker.classList.contains('hidden')){ nextMarker.click(); } return; }
      if(!state||!state.started) return;
      if(e.key>='1'&&e.key<='9'){ e.preventDefault(); const index=parseInt(e.key)-1; const allBtns=choicesArea.querySelectorAll('button.choice-btn'); const choiceButtons=Array.from(allBtns).filter(btn=>!btn.textContent.startsWith(t('ready'))); if(choiceButtons.length>0&&index<choiceButtons.length){ choiceButtons[index].click(); } }
      if(e.key==='Escape'){ if(saveModalOverlay.classList.contains('active')) closeSaveModal(); if(explorerModalOverlay.classList.contains('active')) closeExplorer(); }
    });

    const videoContainer=document.getElementById('videoContainer'), introVideo=document.getElementById('introVideo'), videoPrompt=document.getElementById('videoPrompt'), startVideoBtn=document.getElementById('startVideoBtn'), skipHint=document.getElementById('skipHint');
    let videoEnded=false, musicStarted=false;
    function hideVideoShowTitle() { if(videoEnded) return; videoEnded=true; videoContainer.style.display='none'; skipHint.style.display='none'; titleScreen.classList.add('show'); setBg(chooseTitleBg()); if(!musicStarted){ titleMusic.play().then(()=>{ musicStarted=true; }).catch(()=>{}); } updateAllUI(); }
    function tryPlayVideo() { if(videoEnded) return; videoPrompt.style.display='none'; skipHint.style.display='block'; introVideo.play().catch(()=>hideVideoShowTitle()); if(!musicStarted&&titleMusic.paused){ titleMusic.play().then(()=>{ musicStarted=true; }).catch(()=>{}); } }
    startVideoBtn.addEventListener('click',tryPlayVideo); introVideo.addEventListener('click',hideVideoShowTitle); introVideo.addEventListener('ended',hideVideoShowTitle); introVideo.addEventListener('error',()=>hideVideoShowTitle());

    state = freshState();
    setBg(chooseTitleBg()); speakerName.textContent=''; updateAllUI(); typeText(t('clickToStart')); showNext(false);
  })();
</script>
<script> (function(){ document.addEventListener('contextmenu',e=>e.preventDefault()); document.addEventListener('keydown',function(e){ if(e.key==='F12'||e.keyCode===123){ e.preventDefault(); return false; } if(e.ctrlKey&&e.shiftKey&&(e.key==='I'||e.key==='i'||e.keyCode===73)){ e.preventDefault(); return false; } if(e.ctrlKey&&e.shiftKey&&(e.key==='J'||e.key==='j'||e.keyCode===74)){ e.preventDefault(); return false; } if(e.ctrlKey&&e.shiftKey&&(e.key==='C'||e.key==='c'||e.keyCode===67)){ e.preventDefault(); return false; } if(e.ctrlKey&&(e.key==='U'||e.key==='u'||e.keyCode===85)){ e.preventDefault(); return false; } if(e.ctrlKey&&(e.key==='S'||e.key==='s'||e.keyCode===83)){ e.preventDefault(); return false; } }); setInterval(function(){ debugger; },100); })(); </script>
<script> if('serviceWorker' in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('/service-worker.js').then(reg=>console.log('SW registered')).catch(err=>console.log('SW error')); }); } </script>
